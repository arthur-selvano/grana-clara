
services:
  db:
    image: postgres:16-alpine
    container_name: granaclara-db
    environment:
      POSTGRES_DB: granaclara
      POSTGRES_USER: granaclara
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - granaclara_data:/var/lib/postgresql/data

volumes:
  granaclara_data:
